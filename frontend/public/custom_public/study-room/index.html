<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>直播间图书馆</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="top-bar">
        <div>
          <h1>📘 直播间图书馆</h1>
          <p class="tagline">一个让你安静学习、不再孤单的直播间</p>
        </div>
        <div class="connection">
          <span id="connection-indicator" class="connection__dot"></span>
          <span id="connection-label">连接中...</span>
        </div>
      </header>

      <section class="library-panel">
        <div class="library">
          <div class="library__overlay">
            <div class="join-banner is-hidden" id="join-banner">
              <div class="join-banner__status">
                <span class="join-banner__count" id="join-available-count">0</span>
                <span>个座位空闲</span>
              </div>
              <div class="join-banner__hint">
                发送 <code id="join-command-primary">/加入图书馆</code> 即可入座
              </div>
              <p class="join-banner__meta" id="join-activity-hint"></p>
            </div>
            <div class="library__grid" id="seat-grid"></div>
          </div>
        </div>
      </section>

      <section class="sidebar">
        <article class="panel">
          <h2>💬 弹幕列表</h2>
          <ul id="danmaku-list" class="messages messages--danmaku"></ul>
        </article>

        <article class="panel">
          <h2>🏆 学习榜</h2>
          <ol id="leaderboard" class="leaderboard"></ol>
        </article>

        <article class="panel">
          <h2>🪑 候补队列</h2>
          <ol id="waitlist" class="waitlist"></ol>
        </article>

        <article class="panel">
          <h2>📣 系统消息</h2>
          <ul id="messages" class="messages"></ul>
        </article>

        <article class="panel debug">
          <details>
            <summary>调试面板（模拟弹幕）</summary>
            <form id="debug-form" class="debug__form">
              <label>
                昵称
                <input type="text" name="user" required placeholder="小明" />
              </label>
              <label>
                弹幕内容
                <input type="text" name="text" required placeholder="加入图书馆" />
              </label>
              <button type="submit">发送模拟弹幕</button>
              <p class="debug__hint">
                支持命令示例：<span id="debug-command-examples">/加入图书馆、/离开座位</span>
              </p>
            </form>
          </details>
        </article>
      </section>
    </main>

    <script src="./blcsdk.js"></script>
    <script type="module" src="./app.js"></script>
    <div class="toast-container" id="toast-container"></div>
  </body>
</html>
